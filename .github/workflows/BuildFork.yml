name: Build APK

run-name: Build ${{ inputs.flavor }} ${{ inputs.build_type }} (${{ inputs.abi }})

on:
    workflow_dispatch:
        inputs:
            flavor:
                description: "Flavor"
                type: choice
                default: foss
                options:
                    - foss
                    - gplay
            build_type:
                description: "Build type (release is signed with a stable CI key, debug installs as a separate .debug app)"
                type: choice
                default: release
                options:
                    - release
                    - debug
            abi:
                description: "Architecture (all = one APK per architecture plus a universal APK)"
                type: choice
                default: all
                options:
                    - all
                    - arm64-v8a
                    - armeabi-v7a
                    - x86_64
                    - x86
                    - universal
            r8:
                description: "R8: code shrinking, optimization and obfuscation (release only)"
                type: boolean
                default: true
            shrink_resources:
                description: "Shrink unused resources (needs R8, release only)"
                type: boolean
                default: true
            optimize_images:
                description: "Image optimization: PNG crunching (release only)"
                type: boolean
                default: true
            upload_artifacts:
                description: "Attach the APKs to the run as direct, unzipped downloads"
                type: boolean
                default: true
            publish_release:
                description: "Publish the APKs as a pre-release (direct downloads)"
                type: boolean
                default: true

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up JDK
              uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 21

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v4

            - name: Restore CI signing key
              if: inputs.build_type == 'release'
              id: key-cache
              uses: actions/cache@v4
              with:
                  path: ~/ci-keystore
                  key: ci-keystore-v1

            - name: Create CI signing key
              if: inputs.build_type == 'release' && steps.key-cache.outputs.cache-hit != 'true'
              run: |
                  mkdir -p ~/ci-keystore
                  keytool -genkeypair -keystore ~/ci-keystore/ci.keystore \
                      -storepass android-ci -keypass android-ci -alias ci \
                      -keyalg RSA -keysize 2048 -validity 10000 \
                      -dname "CN=Gallery CI, O=Fork, C=US"

            - name: Build APK
              env:
                  FLAVOR: ${{ inputs.flavor }}
                  BUILD_TYPE: ${{ inputs.build_type }}
                  ABI: ${{ inputs.abi }}
                  R8: ${{ inputs.r8 }}
                  SHRINK_RESOURCES: ${{ inputs.shrink_resources }}
                  OPTIMIZE_IMAGES: ${{ inputs.optimize_images }}
              run: |
                  if [ "$BUILD_TYPE" = "release" ]; then
                      export SIGNING_STORE_FILE="$HOME/ci-keystore/ci.keystore"
                      export SIGNING_STORE_PASSWORD=android-ci
                      export SIGNING_KEY_ALIAS=ci
                      export SIGNING_KEY_PASSWORD=android-ci
                  fi
                  args=(--stacktrace "-PENABLE_R8=$R8" "-PSHRINK_RESOURCES=$SHRINK_RESOURCES" "-PCRUNCH_PNGS=$OPTIMIZE_IMAGES")
                  case "$ABI" in
                      all) args+=(-PABI_SPLITS=true -PUNIVERSAL_APK=true) ;;
                      universal) args+=(-PABI_SPLITS=false) ;;
                      *) args+=(-PABI_SPLITS=true "-PABI_LIST=$ABI" -PUNIVERSAL_APK=false) ;;
                  esac
                  flavor_cap="$(tr '[:lower:]' '[:upper:]' <<< "${FLAVOR:0:1}")${FLAVOR:1}"
                  type_cap="$(tr '[:lower:]' '[:upper:]' <<< "${BUILD_TYPE:0:1}")${BUILD_TYPE:1}"
                  chmod +x ./gradlew
                  ./gradlew "${args[@]}" ":app:assemble${flavor_cap}${type_cap}"

            - name: Collect APKs
              env:
                  FLAVOR: ${{ inputs.flavor }}
                  BUILD_TYPE: ${{ inputs.build_type }}
              run: |
                  version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
                  mkdir -p dist
                  while IFS= read -r apk; do
                      case "$(basename "$apk")" in
                          *arm64-v8a*) abi=arm64-v8a ;;
                          *armeabi-v7a*) abi=armeabi-v7a ;;
                          *x86_64*) abi=x86_64 ;;
                          *x86*) abi=x86 ;;
                          *) abi=universal ;;
                      esac
                      cp "$apk" "dist/Gallery-${version}-${FLAVOR}-${BUILD_TYPE}-${abi}.apk"
                  done < <(find app/build/outputs/apk -name '*.apk' | sort)
                  if ! ls dist/*.apk > /dev/null 2>&1; then
                      echo "No APK produced" >&2
                      exit 1
                  fi
                  ls -lh dist
                  {
                      echo "### APKs"
                      echo '```'
                      ls -lh dist | tail -n +2
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload universal APK
              if: inputs.upload_artifacts
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-universal.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Upload arm64-v8a APK
              if: inputs.upload_artifacts
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-arm64-v8a.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Upload armeabi-v7a APK
              if: inputs.upload_artifacts
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-armeabi-v7a.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Upload x86_64 APK
              if: inputs.upload_artifacts
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-x86_64.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Upload x86 APK
              if: inputs.upload_artifacts
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-x86.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Publish pre-release
              if: inputs.publish_release
              env:
                  GH_TOKEN: ${{ github.token }}
                  FLAVOR: ${{ inputs.flavor }}
                  BUILD_TYPE: ${{ inputs.build_type }}
                  ABI: ${{ inputs.abi }}
                  R8: ${{ inputs.r8 }}
                  SHRINK_RESOURCES: ${{ inputs.shrink_resources }}
                  OPTIMIZE_IMAGES: ${{ inputs.optimize_images }}
              run: |
                  notes="Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.

                  Flavor: ${FLAVOR}
                  Build type: ${BUILD_TYPE}
                  Architecture: ${ABI}
                  R8: ${R8}
                  Resource shrinking: ${SHRINK_RESOURCES}
                  Image optimization: ${OPTIMIZE_IMAGES}"
                  gh release create "build-${{ github.run_number }}" dist/*.apk \
                      --target "${{ github.sha }}" \
                      --prerelease \
                      --title "Build ${{ github.run_number }} (${FLAVOR} ${BUILD_TYPE}, ${ABI})" \
                      --notes "$notes"
