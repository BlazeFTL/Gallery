name: Build APK

run-name: Build ${{ inputs.build_type }}

on:
    workflow_dispatch:
        inputs:
            build_type:
                description: "Build type (release is signed with a stable CI key, debug installs as a separate .debug app)"
                type: choice
                default: release
                options:
                    - release
                    - debug
            optimize:
                description: "Optimize build: R8, resource shrinking and PNG crunching (release only)"
                type: boolean
                default: true
            create_release:
                description: "Create a release"
                type: boolean
                default: true

permissions:
    contents: write

jobs:
    build:
        runs-on: ubuntu-latest
        timeout-minutes: 45
        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up JDK
              uses: actions/setup-java@v5
              with:
                  distribution: temurin
                  java-version: 21

            - name: Set up Gradle
              uses: gradle/actions/setup-gradle@v6

            - name: Restore CI signing key
              if: inputs.build_type == 'release'
              id: key-cache
              uses: actions/cache@v5
              with:
                  path: ~/ci-keystore
                  key: ci-keystore-v1

            - name: Create CI signing key
              if: inputs.build_type == 'release' && steps.key-cache.outputs.cache-hit != 'true'
              run: |
                  mkdir -p ~/ci-keystore
                  keytool -genkeypair -keystore ~/ci-keystore/ci.keystore \
                      -storepass android-ci -keypass android-ci -alias ci \
                      -keyalg RSA -keysize 2048 -validity 10000 \
                      -dname "CN=Gallery CI, O=Fork, C=US"

            - name: Build APK
              env:
                  BUILD_TYPE: ${{ inputs.build_type }}
                  OPTIMIZE: ${{ inputs.optimize }}
              run: |
                  if [ "$BUILD_TYPE" = "release" ]; then
                      export SIGNING_STORE_FILE="$HOME/ci-keystore/ci.keystore"
                      export SIGNING_STORE_PASSWORD=android-ci
                      export SIGNING_KEY_ALIAS=ci
                      export SIGNING_KEY_PASSWORD=android-ci
                  fi
                  type_cap="$(tr '[:lower:]' '[:upper:]' <<< "${BUILD_TYPE:0:1}")${BUILD_TYPE:1}"
                  chmod +x ./gradlew
                  ./gradlew --stacktrace \
                      "-PENABLE_R8=$OPTIMIZE" \
                      "-PSHRINK_RESOURCES=$OPTIMIZE" \
                      "-PCRUNCH_PNGS=$OPTIMIZE" \
                      -PABI_SPLITS=true \
                      -PUNIVERSAL_APK=true \
                      ":app:assemble${type_cap}"

            - name: Collect APKs
              env:
                  BUILD_TYPE: ${{ inputs.build_type }}
              run: |
                  version="$(grep '^VERSION_NAME=' gradle.properties | cut -d= -f2)"
                  mkdir -p dist
                  while IFS= read -r apk; do
                      case "$(basename "$apk")" in
                          *arm64-v8a*) abi=arm64-v8a ;;
                          *armeabi-v7a*) abi=armeabi-v7a ;;
                          *x86_64*) abi=x86_64 ;;
                          *x86*) abi=x86 ;;
                          *) abi=universal ;;
                      esac
                      cp "$apk" "dist/Gallery-${version}-${BUILD_TYPE}-${abi}.apk"
                  done < <(find app/build/outputs/apk -name '*.apk' | sort)
                  if ! ls dist/*.apk > /dev/null 2>&1; then
                      echo "No APK produced" >&2
                      exit 1
                  fi
                  ls -lh dist
                  {
                      echo "### APKs"
                      echo '```'
                      ls -lh dist | tail -n +2
                      echo '```'
                  } >> "$GITHUB_STEP_SUMMARY"

            - name: Upload universal APK
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-universal.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Upload arm64-v8a APK
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-arm64-v8a.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Upload armeabi-v7a APK
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-armeabi-v7a.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Upload x86_64 APK
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-x86_64.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Upload x86 APK
              uses: actions/upload-artifact@v7
              with:
                  path: dist/*-x86.apk
                  archive: false
                  if-no-files-found: ignore

            - name: Create release
              if: inputs.create_release
              env:
                  GH_TOKEN: ${{ github.token }}
                  BUILD_TYPE: ${{ inputs.build_type }}
                  OPTIMIZE: ${{ inputs.optimize }}
              run: |
                  notes="Built from ${GITHUB_SHA::7} on ${GITHUB_REF_NAME}.

                  Build type: ${BUILD_TYPE}
                  Optimized: ${OPTIMIZE}"
                  gh release create "build-${{ github.run_number }}" dist/*.apk \
                      --target "${{ github.sha }}" \
                      --title "Build ${{ github.run_number }} (${BUILD_TYPE})" \
                      --notes "$notes"
